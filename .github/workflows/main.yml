name: ModPage

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests pillow

      - name: 缓存模组图标(跨运行复用, 避免重复下载)
        uses: actions/cache@v4
        with:
          path: cache/icons
          key: mod-icons-${{ runner.os }}
          restore-keys: |
            mod-icons-

      - name: 运行脚本生成 XAML
        run: python main.py

      - name: 检查生成的文件
        run: |
          if [ -f "ModPage.xaml" ]; then
            echo "文件已生成"
            ls -la ModPage.xaml
          else
            echo "文件未生成，请检查脚本"
            exit 1
          fi

      - name: 记录当天已推模组并写回仓库
        run: |
          git config user.name "llsgllsg"
          git config user.email "151439431+llsgllsg@users.noreply.github.com"
          git config http.version HTTP/1.1
          git add history.json images/
          if git diff --cached --quiet; then
            echo "history.json 无变化，跳过提交"
          else
            git commit -m "update history ($(date -u +%F))"
            git push
          fi

      - name: 安装 sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: 确保远程目录存在
        run: |
          sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_PORT || 22 }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "mkdir -p ${{ secrets.SERVER_PATH }}"

      - name: 清理远程旧图片缓存（只保留当天这批）
        run: |
          if [ -z "${{ secrets.SERVER_PATH }}" ]; then
            echo "SERVER_PATH 为空，跳过清理"
          else
            sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_PORT || 22 }} \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "mkdir -p ${{ secrets.SERVER_PATH }}/images && find ${{ secrets.SERVER_PATH }}/images -maxdepth 1 -type f -name '*.png' -delete"
            echo "远程旧图片已清理"
          fi

      - name: 上传 XAML 文件
        run: |
          for i in 1 2; do
            echo "尝试上传 XAML (第 $i 次)"
            if sshpass -p '${{ secrets.SSH_PASSWORD }}' scp -r -o StrictHostKeyChecking=no -P ${{ secrets.SERVER_PORT || 22 }} \
                ModPage.xaml images \
                ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PATH }}/; then
              echo "XAML 上传成功"
              exit 0
            else
              echo "上传失败，等待重试..."
              sleep 5
            fi
          done
          echo "上传失败，放弃"
          exit 1

      - name: 在远程创建/覆盖版本号文件 ModPage.xaml.ini
        run: |
          TIMESTAMP=$(date -u +%s)
          sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_PORT || 22 }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "echo $TIMESTAMP > ${{ secrets.SERVER_PATH }}/ModPage.xaml.ini"
          echo "版本号已更新: $TIMESTAMP"
